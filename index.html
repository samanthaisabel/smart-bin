<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Bin Portal</title>
  <!-- Google Fonts & QRCode.js & Canvas Confetti -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #134e4a, #0f172a 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(16px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* Mode Navigation Tabs */
    .tab-nav {
      display: flex;
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 14px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    /* User Dashboard */
    .dashboard {
      display: none;
      text-align: center;
    }

    .user-greeting {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .live-pulse {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .points-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.1));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .points-label {
      font-size: 0.85rem;
      color: #6ee7b7;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .points-value {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      margin: 6px 0;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .points-value.bump {
      transform: scale(1.2);
      color: #34d399;
    }

    .qr-wrapper {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      display: inline-block;
      margin: 8px auto 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    #qrcode {
      display: flex;
      justify-content: center;
    }

    .qr-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* Admin Multi-Location Card Styles */
    .bins-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .bin-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      transition: border-color 0.2s;
    }

    .bin-card.is-full-card {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.08);
    }

    .bin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .bin-location-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bin-status-chip {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chip-ok {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .chip-warning {
      background: rgba(245, 158, 11, 0.2);
      color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }

    .chip-full {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      animation: pulse 1.5s infinite;
    }

    .capacity-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.5s ease, background 0.3s ease;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .alert-info {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="badge">♻️ SMART BIN</div>
      <h1>SMART BIN</h1>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="tab-nav">
      <button class="tab-btn active" id="tabUserBtn">👤 User</button>
      <button class="tab-btn" id="tabAdminBtn">🛡️ Admin</button>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert"></div>

    <!-- ==================== 1. USER VIEW ==================== -->
    <div id="userSection">
      <!-- User Login / Register Sub-Tabs -->
      <div id="userAuthSubSection">
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <button type="button" id="authModeLogin" class="tab-btn active" style="flex: 1; padding: 10px; font-size: 0.85rem;">
            🔑 Existing User
          </button>
          <button type="button" id="authModeRegister" class="tab-btn" style="flex: 1; padding: 10px; font-size: 0.85rem;">
            ✨ New User
          </button>
        </div>

        <div class="form-group">
          <label id="userFieldLabel">Username</label>
          <input type="text" id="usernameInput" placeholder="e.g. Alex" autocomplete="off" />
        </div>
        <div class="form-group">
          <label id="passwordFieldLabel">Password</label>
          <input type="password" id="userPasswordInput" placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <button type="button" class="btn btn-primary" id="loginBtn">Login to My Account</button>
        <p id="authHintText" style="font-size: 0.75rem; text-align: center; color: var(--text-muted); margin-top: 10px;">
          Returning user? Enter your username and password.
        </p>
      </div>

      <!-- User Dashboard -->
      <div id="userDashboardSubSection" class="dashboard">
        <div class="user-greeting">Welcome, <strong id="displayName"></strong>!</div>
        
        <div class="live-status">
          <div class="live-pulse"></div>
          Live Connected
        </div>

        <div class="points-card">
          <div class="points-label">TOTAL POINTS</div>
          <div class="points-value" id="pointsDisplay">0</div>
        </div>

        <div class="qr-wrapper">
          <div id="qrcode"></div>
        </div>

        <div class="qr-hint">
          Point this QR code at the scanner
        </div>

        <button class="btn btn-secondary" id="logoutBtn">Switch User</button>
      </div>
    </div>

    <!-- ==================== 2. ADMIN VIEW ==================== -->
    <div id="adminSection" style="display: none;">
      <!-- Admin Personnel Authentication -->
      <div id="adminAuthSubSection">
        <p style="font-size:0.8rem; color:var(--text-muted); text-align:center; margin-bottom:16px;">
          🔒 Authorized Personnel Access Only
        </p>
        <div class="form-group">
          <label>Personnel Username</label>
          <input type="text" id="adminUsernameInput" placeholder="Enter admin username" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Personnel Password</label>
          <input type="password" id="adminPasswordInput" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" id="adminLoginBtn">Authenticate & Enter</button>
      </div>

      <!-- Admin Multi-Location Dashboard -->
      <div id="adminDashboardSubSection" style="display: none;">
        <div style="font-size:0.85rem; font-weight:700; color:var(--text-muted); margin-bottom:12px; text-align:left;">
          BIN NETWORK LOCATIONS:
        </div>

        <!-- Dynamic List of Location Cards -->
        <div id="binsList" class="bins-list">
          <!-- Rendered dynamically by JavaScript -->
        </div>

        <button class="btn btn-secondary" id="adminLogoutBtn">Exit Admin</button>
      </div>
    </div>

  </div>

  <script>
    /* =====================================================================
       FIREBASE CONFIGURATION
       ===================================================================== */
    const firebaseConfig = {
      // REPLACE with your Firebase Realtime Database URL:
      databaseURL: "https://smart-trash-bin-demo-default-rtdb.firebaseio.com",
      projectId: "smart-trash-bin-demo"
    };

    let db = null;
    let isFirebaseReady = false;
    try {
      if (firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes("your-project")) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        isFirebaseReady = true;
      }
    } catch (e) {
      console.warn("Firebase not configured with active credentials.", e);
    }

    const chimeAudio = new Audio("https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3");

    // UI Tab Switching Elements
    const tabUserBtn = document.getElementById("tabUserBtn");
    const tabAdminBtn = document.getElementById("tabAdminBtn");
    const userSection = document.getElementById("userSection");
    const adminSection = document.getElementById("adminSection");

    // User Elements
    const userAuthSubSection = document.getElementById("userAuthSubSection");
    const userDashboardSubSection = document.getElementById("userDashboardSubSection");
    const authModeLogin = document.getElementById("authModeLogin");
    const authModeRegister = document.getElementById("authModeRegister");
    const authHintText = document.getElementById("authHintText");
    const usernameInput = document.getElementById("usernameInput");
    const userPasswordInput = document.getElementById("userPasswordInput");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const displayName = document.getElementById("displayName");
    const pointsDisplay = document.getElementById("pointsDisplay");
    const qrContainer = document.getElementById("qrcode");
    const alertBox = document.getElementById("alertBox");

    let isRegisterMode = false;

    // Admin Elements
    const adminAuthSubSection = document.getElementById("adminAuthSubSection");
    const adminDashboardSubSection = document.getElementById("adminDashboardSubSection");
    const adminUsernameInput = document.getElementById("adminUsernameInput");
    const adminPasswordInput = document.getElementById("adminPasswordInput");
    const adminLoginBtn = document.getElementById("adminLoginBtn");
    const adminLogoutBtn = document.getElementById("adminLogoutBtn");
    const binsList = document.getElementById("binsList");

    // =========================================================================
    // ADMIN CREDENTIALS CONFIGURATION
    // You can change the admin username and password here anytime:
    // =========================================================================
    const ADMIN_CREDENTIALS = {
      username: "admin",
      password: "adminpassword123"
    };

    let currentUserId = null;
    let qrInstance = null;
    let userPointsListener = null;
    let binsListener = null;

    // EN Building 1st to 4th Floor Bins (Starts at 0% empty until Arduino sends data)
    const defaultCampusBins = {
      bin_01: {
        location: "EN Bldg 1st floor",
        fill_percent: 0,
        is_full: false
      },
      bin_02: {
        location: "EN Bldg 2nd floor",
        fill_percent: 0,
        is_full: false
      },
      bin_03: {
        location: "EN Bldg 3rd floor",
        fill_percent: 0,
        is_full: false
      },
      bin_04: {
        location: "EN Bldg 4th floor",
        fill_percent: 0,
        is_full: false
      }
    };

    function showAlert(msg, type = "error") {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = "block";
      setTimeout(() => alertBox.style.display = "none", 4000);
    }

    // Tab Navigation
    tabUserBtn.addEventListener("click", () => {
      tabUserBtn.classList.add("active");
      tabAdminBtn.classList.remove("active");
      userSection.style.display = "block";
      adminSection.style.display = "none";
    });

    tabAdminBtn.addEventListener("click", () => {
      tabAdminBtn.classList.add("active");
      tabUserBtn.classList.remove("active");
      userSection.style.display = "none";
      adminSection.style.display = "block";
    });

    // ==================== USER LOGIN / REGISTER MODE SWITCH ====================
    authModeLogin.addEventListener("click", () => {
      isRegisterMode = false;
      authModeLogin.classList.add("active");
      authModeRegister.classList.remove("active");
      loginBtn.textContent = "Login to My Account";
      authHintText.textContent = "Returning user? Enter your username and password.";
    });

    authModeRegister.addEventListener("click", () => {
      isRegisterMode = true;
      authModeRegister.classList.add("active");
      authModeLogin.classList.remove("active");
      loginBtn.textContent = "Create Account & Get QR";
      authHintText.textContent = "New user? Choose a username and create a password.";
    });

    // ==================== USER AUTHENTICATION HANDLER ====================
    loginBtn.addEventListener("click", () => {
      const rawName = usernameInput.value.trim();
      const enteredPassword = userPasswordInput.value;

      if (!rawName) {
        showAlert("Please enter a username!");
        return;
      }
      if (!enteredPassword) {
        showAlert("Please enter a password!");
        return;
      }

      const userId = rawName.toLowerCase().replace(/[^a-z0-9_-]/g, "");
      if (!userId) {
        showAlert("Please use alphanumeric characters (a-z, 0-9)");
        return;
      }

      const defaultBtnText = isRegisterMode ? "Create Account & Get QR" : "Login to My Account";
      loginBtn.disabled = true;
      loginBtn.textContent = "Please wait...";

      const resetBtn = () => {
        loginBtn.disabled = false;
        loginBtn.textContent = defaultBtnText;
      };

      // Safety timeout: Re-enable button after 5 seconds if connection hangs
      const timeoutId = setTimeout(() => {
        resetBtn();
        showAlert("Connection timeout. Please check your internet or Firebase config.");
      }, 5000);

      if (isFirebaseReady && db) {
        const userRef = db.ref("users/" + userId);

        userRef.once("value", (snapshot) => {
          clearTimeout(timeoutId);
          resetBtn();

          const userExists = snapshot.exists();

          if (isRegisterMode) {
            // === NEW USER REGISTRATION ===
            if (userExists) {
              showAlert(`Username '${rawName}' is already taken! Please choose another username.`);
            } else {
              userRef.set({
                name: rawName,
                password: enteredPassword,
                points: 0,
                lastUpdated: Date.now()
              }, (err) => {
                if (err) {
                  showAlert("Registration failed: " + err.message);
                } else {
                  loginUser(userId, rawName);
                }
              });
            }
          } else {
            // === EXISTING USER LOGIN ===
            if (!userExists) {
              showAlert(`Username '${rawName}' not found! Click '✨ New User' to register first.`);
            } else {
              const userData = snapshot.val() || {};
              if (userData.password && userData.password !== enteredPassword) {
                showAlert("Incorrect password! Please try again.");
                userPasswordInput.value = "";
              } else {
                loginUser(userId, rawName);
              }
            }
          }
        }, (err) => {
          clearTimeout(timeoutId);
          resetBtn();
          showAlert("Database error: " + err.message);
        });

      } else {
        // Fallback for local simulation
        clearTimeout(timeoutId);
        resetBtn();

        const savedPass = localStorage.getItem("user_pwd_" + userId);
        if (isRegisterMode) {
          if (savedPass) {
            showAlert(`Username '${rawName}' is already taken!`);
          } else {
            localStorage.setItem("user_pwd_" + userId, enteredPassword);
            loginUser(userId, rawName);
          }
        } else {
          if (!savedPass) {
            showAlert(`User '${rawName}' not found! Click '✨ New User' to register.`);
          } else if (savedPass !== enteredPassword) {
            showAlert("Incorrect password!");
            userPasswordInput.value = "";
          } else {
            loginUser(userId, rawName);
          }
        }
      }
    });

    userPasswordInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        loginBtn.click();
      }
    });

    function loginUser(userId, friendlyName) {
      currentUserId = userId;
      localStorage.setItem("smart_bin_user", JSON.stringify({ userId, friendlyName }));

      userAuthSubSection.style.display = "none";
      userDashboardSubSection.style.display = "block";
      displayName.textContent = friendlyName;

      qrContainer.innerHTML = "";
      qrInstance = new QRCode(qrContainer, {
        text: userId,
        width: 180,
        height: 180,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      listenForPoints(userId);
    }

    let previousPoints = null;

    function listenForPoints(userId) {
      if (isFirebaseReady && db) {
        const userRef = db.ref("users/" + userId);

        userPointsListener = userRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) {
            updatePointsUI(data.points || 0);
          }
        });
      } else {
        const saved = localStorage.getItem("points_" + userId) || 0;
        updatePointsUI(parseInt(saved, 10));
      }
    }

    function updatePointsUI(newPoints) {
      if (previousPoints !== null && newPoints > previousPoints) {
        chimeAudio.play().catch(() => {});
        pointsDisplay.classList.add("bump");
        setTimeout(() => pointsDisplay.classList.remove("bump"), 400);
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
      }
      pointsDisplay.textContent = newPoints;
      previousPoints = newPoints;
    }

    logoutBtn.addEventListener("click", () => {
      if (userPointsListener && db && currentUserId) {
        db.ref("users/" + currentUserId).off("value", userPointsListener);
      }
      localStorage.removeItem("smart_bin_user");
      location.reload();
    });

    // Auto-login user if stored
    const savedUser = localStorage.getItem("smart_bin_user");
    if (savedUser) {
      try {
        const { userId, friendlyName } = JSON.parse(savedUser);
        if (userId && friendlyName) {
          usernameInput.value = friendlyName;
          loginUser(userId, friendlyName);
        }
      } catch (e) {}
    }

    // ==================== ADMIN MULTI-LOCATION DASHBOARD ====================
    adminLoginBtn.addEventListener("click", () => {
      const enteredUser = adminUsernameInput.value.trim();
      const enteredPass = adminPasswordInput.value;

      if (enteredUser === ADMIN_CREDENTIALS.username && enteredPass === ADMIN_CREDENTIALS.password) {
        adminAuthSubSection.style.display = "none";
        adminDashboardSubSection.style.display = "block";
        listenForBins();
      } else {
        showAlert("Access Denied: Invalid Personnel Credentials");
        adminPasswordInput.value = "";
      }
    });

    // Allow pressing ENTER on password field to submit
    adminPasswordInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        adminLoginBtn.click();
      }
    });

    adminLogoutBtn.addEventListener("click", () => {
      if (binsListener && db) {
        db.ref("bins").off("value", binsListener);
      }
      adminDashboardSubSection.style.display = "none";
      adminAuthSubSection.style.display = "block";
      adminUsernameInput.value = "";
      adminPasswordInput.value = "";
    });

    function listenForBins() {
      if (isFirebaseReady && db) {
        binsListener = db.ref("bins").on("value", (snapshot) => {
          const data = snapshot.val() || {};
          // Merge Firebase data with default campus locations
          const merged = Object.assign({}, defaultCampusBins, data);
          renderBinsList(merged);
        });
      } else {
        renderBinsList(defaultCampusBins);
      }
    }

    function renderBinsList(binsData) {
      binsList.innerHTML = "";

      Object.keys(binsData).forEach(key => {
        const bin = binsData[key];
        const locationName = bin.location || "Campus Location";
        const percent = Math.min(100, Math.max(0, Math.round(bin.fill_percent || 0)));
        const isFull = bin.is_full === true || percent >= 80;

        let chipClass = "chip-ok";
        let chipText = "🟢 NOT FULL";
        let fillColor = "var(--primary)";

        if (isFull) {
          chipClass = "chip-full";
          chipText = "🚨 FULL";
          fillColor = "var(--danger)";
        } else if (percent >= 60) {
          chipClass = "chip-warning";
          chipText = "🟡 FILLING UP";
          fillColor = "var(--warning)";
        }

        const card = document.createElement("div");
        card.className = `bin-card ${isFull ? 'is-full-card' : ''}`;
        card.innerHTML = `
          <div class="bin-header">
            <div class="bin-location-title">
              <span>📍</span> <span>${locationName}</span>
            </div>
            <div class="bin-status-chip ${chipClass}">
              ${chipText}
            </div>
          </div>
          <div class="capacity-header">
            <span>BIN CAPACITY</span>
            <span style="font-weight: 800; color: #ffffff;">${percent}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${percent}%; background: ${fillColor};"></div>
          </div>
        `;
        binsList.appendChild(card);
      });
    }
  </script>
</body>
</html>
