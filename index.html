<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Bin Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --danger: #ef4444;
      --warning: #f59e0b;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: radial-gradient(circle at top right, #134e4a, #0f172a 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(16px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
    }
    .header { text-align: center; margin-bottom: 20px; }
    .header .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(16,185,129,0.15); color: #34d399;
      padding: 6px 14px; border-radius: 100px;
      font-size: 0.8rem; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; }
    .tab-nav {
      display: flex; background: rgba(15,23,42,0.7);
      border-radius: 14px; padding: 4px; margin-bottom: 20px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      flex: 1; padding: 10px; font-size: 0.85rem; font-weight: 700;
      border: none; background: transparent; color: var(--text-muted);
      border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: rgba(255,255,255,0.1); color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    input {
      width: 100%; padding: 14px 16px; border-radius: 14px;
      border: 1px solid var(--border); background: rgba(15,23,42,0.8);
      color: var(--text); font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }
    .btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      font-weight: 700; font-size: 1rem; cursor: pointer;
      transition: all 0.2s ease; display: flex; align-items: center;
      justify-content: center; gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white; box-shadow: 0 4px 14px rgba(16,185,129,0.4);
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-secondary {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border); margin-top: 14px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .dashboard { display: none; text-align: center; }
    .user-greeting { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; }
    .live-status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.8rem; color: #34d399; background: rgba(16,185,129,0.1);
      padding: 4px 12px; border-radius: 20px; margin-bottom: 16px;
    }
    .live-pulse { width: 8px; height: 8px; background: #34d399; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52,211,153,0.7); }
      70%  { transform: scale(1);    box-shadow: 0 0 0 8px rgba(52,211,153,0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52,211,153,0); }
    }
    .points-card {
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(59,130,246,0.1));
      border: 1px solid rgba(16,185,129,0.3); border-radius: 20px;
      padding: 18px; margin-bottom: 20px;
    }
    .points-label { font-size: 0.85rem; color: #6ee7b7; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    .points-value {
      font-size: 3.5rem; font-weight: 800; color: #fff;
      line-height: 1.1; margin: 6px 0;
      transition: transform 0.2s cubic-bezier(0.175,0.885,0.32,1.275);
    }
    .points-value.bump { transform: scale(1.2); color: #34d399; }
    .qr-wrapper {
      background: #fff; padding: 16px; border-radius: 20px;
      display: inline-block; margin: 8px auto 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    #qrcode { display: flex; justify-content: center; }
    .qr-hint { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px; }

    /* ntfy Banner */
    .ntfy-banner {
      background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.1));
      border: 1px solid rgba(59,130,246,0.35);
      border-radius: 16px; padding: 14px 16px;
      margin-bottom: 16px; display: flex; align-items: flex-start; gap: 12px;
    }
    .ntfy-banner-icon { font-size: 1.5rem; flex-shrink: 0; margin-top: 2px; }
    .ntfy-banner-body { flex: 1; }
    .ntfy-banner-title {
      font-size: 0.8rem; font-weight: 800; color: #93c5fd;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;
    }
    .ntfy-banner-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }
    .ntfy-banner-desc a { color: #60a5fa; text-decoration: none; font-weight: 700; }
    .ntfy-banner-desc a:hover { text-decoration: underline; }
    .ntfy-test-btn {
      margin-top: 8px; padding: 6px 14px; font-size: 0.78rem; font-weight: 700;
      border: 1px solid rgba(59,130,246,0.4); background: rgba(59,130,246,0.15);
      color: #93c5fd; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .ntfy-test-btn:hover { background: rgba(59,130,246,0.3); color: #fff; }
    .ntfy-test-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .ntfy-sent-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.72rem; font-weight: 700; color: #6ee7b7;
      background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3);
      border-radius: 20px; padding: 3px 10px; margin-left: 8px;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .ntfy-sent-badge.show { opacity: 1; }

    /* Bin Cards */
    .bins-list { display: flex; flex-direction: column; gap: 12px; max-height: 380px; overflow-y: auto; padding-right: 2px; }
    .bin-card { background: rgba(15,23,42,0.6); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: left; transition: border-color 0.2s; }
    .bin-card.is-full-card { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); }
    .bin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .bin-location-title { font-size: 0.95rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 6px; }
    .bin-status-chip { font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    .chip-ok      { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.4); }
    .chip-warning { background: rgba(245,158,11,0.2); color: #fde68a; border: 1px solid rgba(245,158,11,0.4); }
    .chip-full    { background: rgba(239,68,68,0.2);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); animation: pulse 1.5s infinite; }
    .capacity-header { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
    .progress-bar-bg   { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease, background 0.3s ease; }
    .alert { padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .alert-error { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; }
    .alert-info  { background: rgba(59,130,246,0.2); border: 1px solid rgba(59,130,246,0.4); color: #93c5fd; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="badge">♻️ SMART BIN</div>
      <h1>SMART BIN</h1>
    </div>

    <div class="tab-nav">
      <button class="tab-btn active" id="tabUserBtn">👤 User</button>
      <button class="tab-btn" id="tabAdminBtn">🛡️ Admin</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- USER VIEW -->
    <div id="userSection">
      <div id="userAuthSubSection">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="usernameInput" placeholder="Enter your username" autocomplete="off" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="userPasswordInput" placeholder="Enter your password" autocomplete="current-password" />
        </div>
        <button type="button" class="btn btn-primary" id="loginBtn">Login</button>
        <button type="button" class="btn btn-secondary" id="toggleAuthBtn" style="margin-top:10px;font-size:0.85rem;padding:10px;">
          Create New Account
        </button>
      </div>

      <div id="userDashboardSubSection" class="dashboard">
        <div class="user-greeting">Welcome, <strong id="displayName"></strong>!</div>
        <div class="live-status"><div class="live-pulse"></div> Live Connected</div>
        <div class="points-card">
          <div class="points-label">TOTAL POINTS</div>
          <div class="points-value" id="pointsDisplay">0</div>
        </div>
        <div class="qr-wrapper"><div id="qrcode"></div></div>
        <div class="qr-hint">Point this QR code at the scanner</div>
        <button class="btn btn-secondary" id="logoutBtn">Switch User</button>
      </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="adminSection" style="display:none;">
      <div id="adminAuthSubSection">
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="adminPasswordInput" placeholder="Enter admin password" autocomplete="current-password" />
        </div>
        <button class="btn btn-primary" id="adminLoginBtn">Login as Admin</button>
      </div>

      <div id="adminDashboardSubSection" style="display:none;">
        <!-- ntfy.sh Banner -->
        <div class="ntfy-banner">
          <div class="ntfy-banner-icon">🔔</div>
          <div class="ntfy-banner-body">
            <div class="ntfy-banner-title">Live Push Notifications — ntfy.sh</div>
            <div class="ntfy-banner-desc">
              Notifications are sent to phones when a bin is full.<br>
              Install or click for notifications: <a href="https://ntfy.sh/smartbin" target="_blank">ntfy.sh/smartbin</a>
            </div>
            <button class="ntfy-test-btn" id="ntfyTestBtn">📤 Send Test Alert</button>
            <span class="ntfy-sent-badge" id="ntfySentBadge">✓ Sent!</span>
          </div>
        </div>

        <div style="font-size:0.85rem;font-weight:700;color:var(--text-muted);margin-bottom:12px;text-align:left;">
          BIN NETWORK LOCATIONS:
        </div>
        <div id="binsList" class="bins-list"></div>
        <button class="btn btn-secondary" id="adminLogoutBtn">Exit Admin</button>
      </div>
    </div>
  </div>

  <script>
    /* ── FIREBASE ── */
    const firebaseConfig = {
      databaseURL: "https://smart-bin-1310e-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId:   "smart-bin"
    };
    let db = null, isFirebaseReady = false;
    try {
      if (firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes("your-project")) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        isFirebaseReady = true;
      }
    } catch(e) { console.warn("Firebase init error:", e); }

    const chimeAudio = new Audio("https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3");

    /* ── ELEMENT REFS ── */
    const tabUserBtn              = document.getElementById("tabUserBtn");
    const tabAdminBtn             = document.getElementById("tabAdminBtn");
    const userSection             = document.getElementById("userSection");
    const adminSection            = document.getElementById("adminSection");
    const userAuthSubSection      = document.getElementById("userAuthSubSection");
    const userDashboardSubSection = document.getElementById("userDashboardSubSection");
    const usernameInput           = document.getElementById("usernameInput");
    const userPasswordInput       = document.getElementById("userPasswordInput");
    const loginBtn                = document.getElementById("loginBtn");
    const toggleAuthBtn           = document.getElementById("toggleAuthBtn");
    const logoutBtn               = document.getElementById("logoutBtn");
    const displayName             = document.getElementById("displayName");
    const pointsDisplay           = document.getElementById("pointsDisplay");
    const qrContainer             = document.getElementById("qrcode");
    const alertBox                = document.getElementById("alertBox");
    const adminAuthSubSection      = document.getElementById("adminAuthSubSection");
    const adminDashboardSubSection = document.getElementById("adminDashboardSubSection");
    const adminPasswordInput       = document.getElementById("adminPasswordInput");
    const adminLoginBtn            = document.getElementById("adminLoginBtn");
    const adminLogoutBtn           = document.getElementById("adminLogoutBtn");
    const binsList                 = document.getElementById("binsList");

    const ADMIN_PASSWORD = "adminpassword123";
    let isRegisterMode = false, currentUserId = null;
    let qrInstance = null, userPointsListener = null, binsListener = null;

    const defaultCampusBins = {
      bin_01: { location: "EN Bldg 1st floor", fill_percent: 0, is_full: false },
      bin_02: { location: "EN Bldg 2nd floor", fill_percent: 0, is_full: false },
      bin_03: { location: "EN Bldg 3rd floor", fill_percent: 0, is_full: false },
      bin_04: { location: "EN Bldg 4th floor", fill_percent: 0, is_full: false }
    };

    function showAlert(msg, type = "error") {
      alertBox.textContent = msg;
      alertBox.className   = "alert alert-" + type;
      alertBox.style.display = "block";
      setTimeout(() => alertBox.style.display = "none", 4000);
    }

    /* ── TABS ── */
    tabUserBtn.addEventListener("click", () => {
      tabUserBtn.classList.add("active"); tabAdminBtn.classList.remove("active");
      userSection.style.display = "block"; adminSection.style.display = "none";
    });
    tabAdminBtn.addEventListener("click", () => {
      tabAdminBtn.classList.add("active"); tabUserBtn.classList.remove("active");
      userSection.style.display = "none"; adminSection.style.display = "block";
    });

    /* ── USER TOGGLE ── */
    toggleAuthBtn.addEventListener("click", () => {
      isRegisterMode = !isRegisterMode;
      loginBtn.textContent      = isRegisterMode ? "Create Account & Get QR" : "Login";
      toggleAuthBtn.textContent = isRegisterMode ? "Already have an account? Login" : "Create New Account";
    });

    /* ── USER AUTH ── */
    loginBtn.addEventListener("click", () => {
      const rawName         = usernameInput.value.trim();
      const enteredPassword = userPasswordInput.value;
      if (!rawName)         { showAlert("Please enter a username!"); return; }
      if (!enteredPassword) { showAlert("Please enter a password!"); return; }
      const userId = rawName.toLowerCase().replace(/[^a-z0-9_-]/g, "");
      if (!userId)  { showAlert("Please use alphanumeric characters (a-z, 0-9)"); return; }

      const defaultBtnText = isRegisterMode ? "Create Account & Get QR" : "Login";
      loginBtn.disabled = true; loginBtn.textContent = "Please wait...";
      const resetBtn = () => { loginBtn.disabled = false; loginBtn.textContent = defaultBtnText; };

      const doLocalAuth = () => {
        resetBtn();
        const savedPass = localStorage.getItem("user_pwd_" + userId);
        if (isRegisterMode) {
          if (savedPass) { showAlert("Username '" + rawName + "' is already taken!"); }
          else { localStorage.setItem("user_pwd_" + userId, enteredPassword); loginUser(userId, rawName); }
        } else {
          if (!savedPass) { showAlert("Username '" + rawName + "' not found! Click 'Create New Account' below."); }
          else if (savedPass !== enteredPassword) { showAlert("Incorrect password!"); userPasswordInput.value = ""; }
          else { loginUser(userId, rawName); }
        }
      };

      if (isFirebaseReady && db) {
        const userRef = db.ref("users/" + userId);
        const timer   = setTimeout(() => { console.warn("Firebase timeout"); doLocalAuth(); }, 3000);
        userRef.once("value", (snap) => {
          clearTimeout(timer); resetBtn();
          if (isRegisterMode) {
            if (snap.exists()) { showAlert("Username '" + rawName + "' is already taken!"); }
            else { userRef.set({ name: rawName, password: enteredPassword, points: 0, lastUpdated: Date.now() }, (err) => { if (err) doLocalAuth(); else loginUser(userId, rawName); }); }
          } else {
            if (!snap.exists()) { showAlert("Username '" + rawName + "' not found!"); }
            else {
              const d = snap.val() || {};
              if (d.password && d.password !== enteredPassword) { showAlert("Incorrect password!"); userPasswordInput.value = ""; }
              else { loginUser(userId, rawName); }
            }
          }
        }, () => { clearTimeout(timer); doLocalAuth(); });
      } else { doLocalAuth(); }
    });

    userPasswordInput.addEventListener("keypress", (e) => { if (e.key === "Enter") loginBtn.click(); });

    function loginUser(userId, friendlyName) {
      currentUserId = userId;
      localStorage.setItem("smart_bin_user", JSON.stringify({ userId, friendlyName }));
      userAuthSubSection.style.display      = "none";
      userDashboardSubSection.style.display = "block";
      displayName.textContent = friendlyName;
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, { text: userId, width: 180, height: 180, colorDark: "#0f172a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H });
      listenForPoints(userId);
    }

    let previousPoints = null;
    function listenForPoints(userId) {
      if (isFirebaseReady && db) {
        userPointsListener = db.ref("users/" + userId).on("value", (snap) => { const d = snap.val(); if (d) updatePointsUI(d.points || 0); });
      } else { updatePointsUI(parseInt(localStorage.getItem("points_" + userId) || 0, 10)); }
    }
    function updatePointsUI(n) {
      if (previousPoints !== null && n > previousPoints) {
        chimeAudio.play().catch(() => {});
        pointsDisplay.classList.add("bump");
        setTimeout(() => pointsDisplay.classList.remove("bump"), 400);
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
      }
      pointsDisplay.textContent = n; previousPoints = n;
    }

    logoutBtn.addEventListener("click", () => {
      if (userPointsListener && db && currentUserId) db.ref("users/" + currentUserId).off("value", userPointsListener);
      localStorage.removeItem("smart_bin_user"); location.reload();
    });

    const savedUser = localStorage.getItem("smart_bin_user");
    if (savedUser) { try { const { userId, friendlyName } = JSON.parse(savedUser); if (userId && friendlyName) { usernameInput.value = friendlyName; loginUser(userId, friendlyName); } } catch(e) {} }

    /* ── ADMIN ── */
    adminLoginBtn.addEventListener("click", () => {
      const p = adminPasswordInput.value;
      if (p === ADMIN_PASSWORD || p === "admin123" || p === "admin") {
        adminAuthSubSection.style.display      = "none";
        adminDashboardSubSection.style.display = "block";
        listenForBins();
      } else { showAlert("Incorrect admin password!"); adminPasswordInput.value = ""; }
    });
    adminPasswordInput.addEventListener("keypress", (e) => { if (e.key === "Enter") adminLoginBtn.click(); });
    adminLogoutBtn.addEventListener("click", () => {
      if (binsListener && db) db.ref("bins").off("value", binsListener);
      adminDashboardSubSection.style.display = "none";
      adminAuthSubSection.style.display      = "block";
      adminPasswordInput.value = "";
    });

    function listenForBins() {
      if (isFirebaseReady && db) {
        binsListener = db.ref("bins").on("value", (snap) => {
          renderBinsList(Object.assign({}, defaultCampusBins, snap.val() || {}));
        });
      } else { renderBinsList(defaultCampusBins); }
    }

    function renderBinsList(binsData) {
      binsList.innerHTML = "";
      checkBinsForAlerts(binsData);
      Object.keys(binsData).forEach(key => {
        const bin      = binsData[key];
        const name     = bin.location || "Campus Location";
        const percent  = Math.min(100, Math.max(0, Math.round(bin.fill_percent || 0)));
        const isFull   = bin.is_full === true || percent >= 80;
        const chipClass = isFull ? "chip-full" : percent >= 60 ? "chip-warning" : "chip-ok";
        const chipText  = isFull ? "🚨 FULL" : percent >= 60 ? "🟡 FILLING UP" : "🟢 NOT FULL";
        const fillColor = isFull ? "var(--danger)" : percent >= 60 ? "var(--warning)" : "var(--primary)";
        const card = document.createElement("div");
        card.className = "bin-card" + (isFull ? " is-full-card" : "");
        card.innerHTML =
          '<div class="bin-header">' +
            '<div class="bin-location-title"><span>📍</span> <span>' + name + '</span></div>' +
            '<div class="bin-status-chip ' + chipClass + '">' + chipText + '</div>' +
          '</div>' +
          '<div class="capacity-header"><span>BIN CAPACITY</span><span style="font-weight:800;color:#fff;">' + percent + '%</span></div>' +
          '<div class="progress-bar-bg"><div class="progress-bar-fill" style="width:' + percent + '%;background:' + fillColor + ';"></div></div>';
        binsList.appendChild(card);
      });
    }

    /* ── NTFY.SH PUSH NOTIFICATIONS (100% free) ──
       Topic: smartbin
       Subscribe: https://ntfy.sh/smartbin
       ─────────────────────────────────────────── */
    const NTFY_TOPIC = "smartbin";
    const NTFY_URL = "https://ntfy.sh/" + NTFY_TOPIC;
    const alertedBins = {};                           // prevents duplicate alerts

    async function sendNtfyAlert(binKey, location, fillPercent, isTest = false) {
      const message = isTest
        ? "Smart Bin Notification Works. This is a test notification."
        : "Bin full at location: " + location + ". It has reached " + fillPercent + " percent capacity.";

      try {
        // ntfy only delivers if the topic is in the URL, e.g. https://ntfy.sh/smartbin
        const res = await fetch(NTFY_URL, {
          method: "POST",
          body: message
        });
        if (res.ok) {
          console.log("[ntfy] Alert sent successfully!");
          if (!isTest && binKey) alertedBins[binKey] = true;
          return true;
        }
        console.warn("[ntfy] Server error:", res.status);
        return false;
      } catch (err) {
        console.warn("[ntfy] Could not send push notification:", err);
        return false;
      }
    }

    document.getElementById("ntfyTestBtn").addEventListener("click", async () => {
      const btn   = document.getElementById("ntfyTestBtn");
      const badge = document.getElementById("ntfySentBadge");
      btn.disabled = true; btn.textContent = "Sending…";
      const ok = await sendNtfyAlert(null, null, null, true);
      btn.textContent = "📤 Send Test Alert"; btn.disabled = false;
      if (ok) {
        badge.classList.add("show");
        setTimeout(() => badge.classList.remove("show"), 3000);
      } else {
        showAlert("Could not send the ntfy alert. Subscribe at ntfy.sh/smartbin and try again.");
      }
    });

    function checkBinsForAlerts(binsData) {
      Object.keys(binsData).forEach(key => {
        const bin     = binsData[key];
        const percent = Math.min(100, Math.max(0, Math.round(bin.fill_percent || 0)));
        const isFull  = bin.is_full === true || percent >= 80;
        if (isFull && !alertedBins[key]) {
          sendNtfyAlert(key, bin.location || "Campus Bin", percent, false);
        } else if (!isFull && alertedBins[key]) {
          delete alertedBins[key];
        }
      });
    }
  </script>
</body>
