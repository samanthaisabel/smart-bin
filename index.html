<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoRewards - Smart Trash Bin Portal</title>
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- QRCode.js for client-side QR generation (No server needed) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Canvas Confetti for celebratory points animation -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Firebase App & Realtime Database SDKs (Compat version for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --accent: #3b82f6;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #134e4a, #0f172a 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(16px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Auth Form */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    /* Dashboard */
    .dashboard {
      display: none;
      text-align: center;
    }

    .user-greeting {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .points-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(59, 130, 246, 0.1));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      position: relative;
    }

    .points-label {
      font-size: 0.85rem;
      color: #6ee7b7;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .points-value {
      font-size: 3.5rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.1;
      margin: 6px 0;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .points-value.bump {
      transform: scale(1.2);
      color: #34d399;
    }

    .qr-wrapper {
      background: #ffffff;
      padding: 16px;
      border-radius: 20px;
      display: inline-block;
      margin: 10px auto 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    #qrcode {
      display: flex;
      justify-content: center;
    }

    .qr-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: #34d399;
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .live-pulse {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    .alert {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .alert-info {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }

    .history-card {
      margin-top: 14px;
      text-align: left;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 14px;
      padding: 12px;
      font-size: 0.8rem;
      max-height: 110px;
      overflow-y: auto;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: var(--text-muted);
    }
    .history-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="badge">♻️ SMART BIN</div>
      <h1>SMART BIN</h1>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert"></div>

    <!-- 1. LOGIN / REGISTER VIEW -->
    <div id="authSection">
      <div class="form-group">
        <label>Enter Username</label>
        <input type="text" id="usernameInput" placeholder="e.g. Alex" />
      </div>
      <button class="btn btn-primary" id="loginBtn">Get QR Code</button>
    </div>

    <!-- 2. DASHBOARD VIEW -->
    <div id="dashboardSection" class="dashboard">
      <div class="user-greeting">Welcome, <strong id="displayName"></strong>!</div>
      
      <!-- Live Status -->
      <div class="live-status">
        <div class="live-pulse"></div>
        Live Connected
      </div>

      <!-- Real-time Points Display -->
      <div class="points-card">
        <div class="points-label">TOTAL POINTS</div>
        <div class="points-value" id="pointsDisplay">0</div>
      </div>

      <!-- QR Code Container -->
      <div class="qr-wrapper">
        <div id="qrcode"></div>
      </div>

      <div class="qr-hint">
        Point this QR code at the scanner
      </div>

      <!-- Recent Log -->
      <div class="history-card" id="historyLog">
        <div style="font-weight: 700; margin-bottom: 4px; color: #f8fafc;">Recent Activity:</div>
        <div class="history-item">
          <span>Ready</span>
          <span>Just now</span>
        </div>
      </div>

      <button class="btn btn-secondary" id="logoutBtn" style="margin-top: 16px;">Switch User</button>
    </div>
  </div>

  <script>
    /* =====================================================================
       FIREBASE CONFIGURATION
       To connect your own free Firebase Database:
       1. Go to https://console.firebase.google.com/
       2. Click "Add project" -> Name it (e.g. "smart-trash-bin")
       3. Go to "Build" -> "Realtime Database" -> "Create Database"
       4. Start in "Test Mode" (allows read/write)
       5. Copy your databaseURL and replace below!
       ===================================================================== */
    const firebaseConfig = {
      // REPLACE with your Firebase project config or databaseURL:
      databaseURL: "https://smart-trash-bin-demo-default-rtdb.firebaseio.com",
      projectId: "smart-trash-bin-demo"
    };

    // Initialize Firebase
    let db = null;
    let isFirebaseReady = false;
    try {
      if (firebaseConfig.databaseURL && !firebaseConfig.databaseURL.includes("your-project")) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        isFirebaseReady = true;
      }
    } catch (e) {
      console.warn("Firebase not configured with active credentials. Running in local simulation mode.", e);
    }

    // Audio chime sound when points increase
    const chimeAudio = new Audio("https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3");

    // Elements
    const authSection = document.getElementById("authSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const usernameInput = document.getElementById("usernameInput");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const displayName = document.getElementById("displayName");
    const pointsDisplay = document.getElementById("pointsDisplay");
    const alertBox = document.getElementById("alertBox");
    const historyLog = document.getElementById("historyLog");
    const qrContainer = document.getElementById("qrcode");

    let currentUserId = null;
    let qrInstance = null;
    let pointsListener = null;

    function showAlert(msg, type = "error") {
      alertBox.textContent = msg;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = "block";
      setTimeout(() => alertBox.style.display = "none", 4000);
    }

    // Handle Login / Registration
    loginBtn.addEventListener("click", () => {
      const rawName = usernameInput.value.trim();
      if (!rawName) {
        showAlert("Please enter a username or student ID!");
        return;
      }

      // Sanitize username for Firebase path (alphanumeric only)
      const userId = rawName.toLowerCase().replace(/[^a-z0-9_-]/g, "");
      if (!userId) {
        showAlert("Please use alphanumeric characters (a-z, 0-9)");
        return;
      }

      loginUser(userId, rawName);
    });

    function loginUser(userId, friendlyName) {
      currentUserId = userId;
      localStorage.setItem("smart_bin_user", JSON.stringify({ userId, friendlyName }));

      authSection.style.display = "none";
      dashboardSection.style.display = "block";
      displayName.textContent = friendlyName;

      // Generate QR Code containing the userId
      qrContainer.innerHTML = "";
      qrInstance = new QRCode(qrContainer, {
        text: userId, // Raspberry Pi scanner reads this exact text
        width: 180,
        height: 180,
        colorDark: "#0f172a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      // Listen for Live Point Changes
      listenForPoints(userId);
    }

    let previousPoints = null;

    function listenForPoints(userId) {
      if (isFirebaseReady && db) {
        const userRef = db.ref("users/" + userId);

        // Ensure user entry exists
        userRef.child("name").once("value", (snap) => {
          if (!snap.exists()) {
            userRef.set({ name: displayName.textContent, points: 0, lastUpdated: Date.now() });
          }
        });

        // Realtime Listener - Fires INSTANTLY when Raspberry Pi writes to DB!
        pointsListener = userRef.on("value", (snapshot) => {
          const data = snapshot.val();
          if (data) {
            updatePointsUI(data.points || 0);
          }
        });
      } else {
        // Fallback for demonstration / local testing when Firebase config isn't added yet
        showAlert("Tip: Put your Firebase databaseURL in index.html to connect live to Raspberry Pi!", "info");
        
        // Setup local storage simulation listener across tabs
        const saved = localStorage.getItem("points_" + userId) || 0;
        updatePointsUI(parseInt(saved, 10));

        window.addEventListener("storage", (e) => {
          if (e.key === "points_" + userId) {
            updatePointsUI(parseInt(e.newValue || 0, 10));
          }
        });
      }
    }

    function updatePointsUI(newPoints) {
      if (previousPoints !== null && newPoints > previousPoints) {
        const gained = newPoints - previousPoints;
        triggerCelebration(gained);
      }

      pointsDisplay.textContent = newPoints;
      previousPoints = newPoints;
    }

    function triggerCelebration(gained) {
      // Audio chime
      chimeAudio.play().catch(() => {});

      // Point bounce animation
      pointsDisplay.classList.add("bump");
      setTimeout(() => pointsDisplay.classList.remove("bump"), 400);

      // Confetti burst
      confetti({
        particleCount: 50,
        spread: 60,
        origin: { y: 0.6 }
      });

      // Add to log
      const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const item = document.createElement("div");
      item.className = "history-item";
      item.innerHTML = `<span style="color:#34d399;">+${gained} point (Trash Disposed)</span><span>${timeStr}</span>`;
      historyLog.prepend(item);
    }

    // Auto-login if previously logged in on this browser
    const savedUser = localStorage.getItem("smart_bin_user");
    if (savedUser) {
      try {
        const { userId, friendlyName } = JSON.parse(savedUser);
        if (userId && friendlyName) {
          usernameInput.value = friendlyName;
          loginUser(userId, friendlyName);
        }
      } catch (e) {}
    }

    // Logout
    logoutBtn.addEventListener("click", () => {
      if (pointsListener && db && currentUserId) {
        db.ref("users/" + currentUserId).off("value", pointsListener);
      }
      localStorage.removeItem("smart_bin_user");
      location.reload();
    });
  </script>
</body>
</html>
